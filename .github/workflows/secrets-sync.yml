name: Sync Cloudflare Worker Secrets

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: true
        default: 'production'

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync secrets to Cloudflare KV and Workers
        run: |
          echo "Syncing secrets for environment: ${{ github.event.inputs.target_env }}"
